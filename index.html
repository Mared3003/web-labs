<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Магазин</title>
    <link rel="stylesheet" href="/src/style.css" />
<header class="header">
  <div class="container header__row">
    <a class="logo" href="#" aria-label="Главная">
      <img class="icon" src="/icons/home.svg" alt="" />
    </a>

    <form class="search search--compact" role="search">
      <input class="search__input" type="search" placeholder="Поиск..." />
    </form>

    <nav class="actions">
      <button class="icon-btn" aria-label="Избранное">
        <img class="icon" src="/icons/heart.svg" alt="" />
      </button>
      <button class="icon-btn" aria-label="Корзина">
        <img class="icon" src="/icons/cart.svg" alt="" />
      </button>
    </nav>
  </div>
</header>

    <main class="container content">
      <section class="section">
        <h2 class="section__title">Худи</h2>
        <div id="grid-hoodies" class="grid"></div>
      </section>

      <section class="section">
        <h2 class="section__title">Шорты</h2>
        <div id="grid-shorts" class="grid"></div>
      </section>
    </main>

    <footer class="footer">
      <div class="container footer__row">
        <!-- <small></small> -->
        <nav class="footer__links">
          <a href="#">© 2025 Магазин</a>
          <a href="#">Политика и безопасность</a>
          <a href="#">Cookie</a>
        </nav>
      </div>
    </footer>

    <!-- Нижняя навигация только для телефона -->
    <nav class="mobile-nav">
      <a href="#" aria-label="Главная">🏠<span>Главная</span></a>
      <a href="#" aria-label="Избранное">❤️<span>Избранное</span></a>
      <a href="#" aria-label="Корзина">🛒<span>Корзина</span></a>
    </nav>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
